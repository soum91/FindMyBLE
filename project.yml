name: FindMyBLE
options:
  bundleIdPrefix: com.soumen
  deploymentTarget:
    iOS: "17.0"
targets:
  FindMyBLE:
    type: application
    platform: iOS
    sources: [FindMyBLE]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soumen.findmyble
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: FindMyBLE/Info.plist
      properties:
        CFBundleDisplayName: FindMyBLE
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central, location]
        NSBluetoothAlwaysUsageDescription: Watches your items so you don't leave them behind.
        NSLocationWhenInUseUsageDescription: Saves where your item was when it disconnected.
        NSLocationAlwaysAndWhenInUseUsageDescription: Saves where your item was when it disconnected, even when the app is in the background.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
