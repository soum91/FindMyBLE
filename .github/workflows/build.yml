name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: FindMyBLE
  BUILD: ${{ github.run_number }}
  TAG: v1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project FindMyBLE.xcodeproj -scheme FindMyBLE \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FindMyBLE.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/FindMyBLE.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/FindMyBLE.app/Info.plist)
          # Sideloaders (FlareStore etc.) only compare the version string, so make it <version>.<build>.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" Payload/FindMyBLE.app/Info.plist
          # Widget extension: same build and version as the app, or iOS refuses to install it.
          WIDGET=Payload/FindMyBLE.app/PlugIns/FindMyBLEWidget.appex
          test -d "$WIDGET"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$WIDGET/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" "$WIDGET/Info.plist"
          # Ad-hoc sign with the App Group entitlement so AltStore/Sideloadly keep it and the widget can read the app's data.
          codesign --force --sign - --timestamp=none --entitlements FindMyBLEWidget/FindMyBLEWidget.entitlements "$WIDGET"
          codesign --force --sign - --timestamp=none --entitlements FindMyBLE/FindMyBLE.entitlements Payload/FindMyBLE.app
          codesign -d --entitlements - "$WIDGET" || true
          IPA="$APP-$VERSION-build-$BUILD.ipa"
          zip -qr "$IPA" Payload
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Changelog
        run: |
          .github/scripts/release-notes.sh "$APP" "$VERSION" "$BUILD" 'v1.0.*' "$TAG" \
            "Unsigned IPA. Install with Sideloadly, AltStore or TrollStore. Keep app extensions on so the widget comes along." > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-build-${{ env.BUILD }}-ipa
          path: ${{ env.IPA }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FindMyBLE v1.0.${{ env.BUILD }} (build ${{ env.BUILD }})
          body_path: release-notes.md
          files: ${{ env.IPA }}
          make_latest: true

      - name: Update sideloading source (FlareStore / AltStore / SideStore)
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$IPA"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/source"
            if git fetch -q origin source; then
              git worktree add -q -f --detach "$RUNNER_TEMP/source" FETCH_HEAD
            else
              git worktree add -q -f --detach "$RUNNER_TEMP/source"
              git -C "$RUNNER_TEMP/source" checkout -q --orphan source
              git -C "$RUNNER_TEMP/source" rm -rqf .
            fi
            python3 .github/scripts/update-source.py "$RUNNER_TEMP/source/source.json" "$IPA" "$URL" "release-notes.md"
            git -C "$RUNNER_TEMP/source" add source.json
            git -C "$RUNNER_TEMP/source" commit -qm "Source: $APP build $BUILD"
            git -C "$RUNNER_TEMP/source" push -q origin HEAD:refs/heads/source && break
            git worktree remove -f "$RUNNER_TEMP/source"
            sleep 5
          done
