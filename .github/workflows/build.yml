name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project FindMyBLE.xcodeproj -scheme FindMyBLE \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FindMyBLE.app Payload/
          zip -qr FindMyBLE-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FindMyBLE-unsigned-ipa
          path: FindMyBLE-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FindMyBLE v1.0.${{ github.run_number }}
          body: |
            Unsigned build of ${{ github.sha }}.
            Install FindMyBLE-unsigned.ipa with Sideloadly, AltStore or TrollStore.
          files: FindMyBLE-unsigned.ipa
          make_latest: true
